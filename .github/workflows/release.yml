name: Release (tagged)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      artifact: ${{ steps.meta.outputs.artifact }}
    env:
      BUILD_TYPE: Release
      INSTALL_DIR: ${{ github.workspace }}/install

    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag || '' }}"
            if [[ -z "$TAG" ]]; then
              echo "When dispatching manually, you must provide 'tag' (e.g. v1.2.3)." >&2
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # Optional: validate tag format like v1.2.3 (allow v1 or v1.2 etc.)
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Tag '$TAG' does not match expected format (e.g. v1.2.3)." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "artifact=vicinae-linux-x86_64-$TAG.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag }}

      - name: Install Qt and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-wayland-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-cursor-dev \
            libxcb-xkb-dev \
            libxcb-keysyms1-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-render-util0-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libsecret-1-dev \
            libqalculate-dev \
            nodejs \
            npm

      - name: Prepare dirs
        run: mkdir -p build install

      - name: Configure CMake
        run: |
          cd build
          cmake -G Ninja .. \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5  \
            -DBUILD_TESTS=ON  \
            -DVICINAE_PROVENANCE=binary_release \
            -DLTO=ON \
            -DUSE_SYSTEM_CMARK_GFM=OFF \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build
        run: |
          cmake --build build --config ${BUILD_TYPE} --parallel $(nproc)

      - name: Run Tests
        run: make test

      - name: Install
        run: |
          cd build
          cmake --install . --config ${BUILD_TYPE}

      - name: Package (tar install dir)
        run: |
          cd "${INSTALL_DIR}"
          tar -czvf "${{ github.workspace }}/${{ steps.meta.outputs.artifact }}" .

      - name: Fetch sponsors
        id: sponsors
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          logins=$(gh api graphql -f query='
            query {
              organization(login: "vicinaehq") {
                sponsors(first: 100) {
                  nodes {
                    ... on User { login }
                    ... on Organization { login }
                  }
                }
              }
            }
          ' --jq '.data.organization.sponsors.nodes[].login' 2>/dev/null || true)

          if [[ -z "$logins" ]]; then
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'body<<SPONSORS_EOF'
              echo ""
              echo "## Sponsors"
              echo ""
              echo "Thanks to our sponsors for supporting vicinae!"
              echo ""
              while IFS= read -r login; do
                echo "- [@${login}](https://github.com/${login})"
              done <<< "$logins"
              echo 'SPONSORS_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.artifact }}

      - name: Append sponsors to release notes
        if: steps.sponsors.outputs.body != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          append_body: true
          body: ${{ steps.sponsors.outputs.body }}

  build-deb:
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      BUILD_TYPE: Release
      INSTALL_DIR: ${{ github.workspace }}/install
      VERSION: ${{ needs.build-binary.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build-binary.outputs.tag }}

      - name: Install Qt and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-wayland-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-cursor-dev \
            libxcb-xkb-dev \
            libxcb-keysyms1-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-render-util0-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libsecret-1-dev \
            libqalculate-dev \
            nodejs \
            npm

      - name: Install nfpm
        run: |-
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.goreleaser.com/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/goreleaser-archive-keyring.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/goreleaser-archive-keyring.gpg] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -y
          sudo apt-get install -y nfpm

      - name: Prepare dirs
        run: mkdir -p build install

      - name: Configure CMake
        run: |
          cd build
          cmake -G Ninja ..                           \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE}          \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5        \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"   \
            -DVICINAE_PROVENANCE=deb                  \
            -DLTO=ON

      - name: Build
        run: |
          cmake --build build --config ${BUILD_TYPE} --parallel $(nproc)

      - name: Install
        run: |
          cmake --install build

      - name: Make Deb Package
        run: ./scripts/mkdeb.sh

      - name: Upload Deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-binary.outputs.tag }}
          name: ${{ needs.build-binary.outputs.tag }}
          files: |
            *.deb

  build-appimage:
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_TYPE: Release
      INSTALL_DIR: ${{ github.workspace }}/install
      APP_DIR: ${{ github.workspace }}/appdir

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build-binary.outputs.tag }}

      - name: Install Qt and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-wayland-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-cursor-dev \
            libxcb-xkb-dev \
            libxcb-keysyms1-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-render-util0-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libsecret-1-dev \
            libqalculate-dev \
            nodejs \
            npm \
            libfuse2

      - name: Prepare dirs
        run: mkdir -p build install

      - name: Configure CMake
        run: |
          cd build
          cmake -G Ninja ..                           \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE}          \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5        \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"   \
            -DVICINAE_PROVENANCE=appimage             \
            -DLTO=ON

      - name: Build
        run: |
          cmake --build build --config ${BUILD_TYPE} --parallel $(nproc)

      - name: Install
        run: |
          cmake --install build

      - name: Make AppImage
        run: |
          chmod +x ./scripts/mkappimage.sh
          ./scripts/mkappimage.sh "${INSTALL_DIR}" "${APP_DIR}"

      - name: Upload AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-binary.outputs.tag }}
          name: ${{ needs.build-binary.outputs.tag }}
          files: |
            *.AppImage

  trigger-packaging:
    needs: [build-binary, build-appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger bumpver in packaging-arch
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_AUR_TOKEN }}
        run: |
          gh workflow run bumpver.yml --repo vicinaehq/packaging-arch
